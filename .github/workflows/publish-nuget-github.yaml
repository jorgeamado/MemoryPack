name: Publish NuGet (GitHub Packages)

# Packs the MemoryPack.* projects and pushes them to this repository owner's
# GitHub Packages NuGet feed (https://nuget.pkg.github.com/<owner>/index.json).
#
# Triggers:
#   - Pushing a tag like `v1.2.3`  -> publishes version 1.2.3
#   - Manual run (workflow_dispatch) with an explicit version, or a dev version
#
# Auth uses the built-in GITHUB_TOKEN (no secrets to configure). The token only
# has access to the current repo's owner feed, so package IDs can stay MemoryPack.*.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.21.4). Leave empty for a 0.0.0-dev build."
        required: false
        default: ""
      ref:
        description: "Git ref to build (tag/branch/sha). Leave empty to build the dispatched ref. Use this to (re)publish historical upstream tags, e.g. 1.21.4."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FEED: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Build
        run: dotnet build MemoryPack.sln -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Pack
        run: >
          dotnet pack MemoryPack.sln -c Release --no-build
          -p:Version=${{ steps.ver.outputs.version }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:PackageProjectUrl=${{ github.server_url }}/${{ github.repository }}
          -o ./artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "${FEED}"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./artifacts/*.nupkg
          retention-days: 7
